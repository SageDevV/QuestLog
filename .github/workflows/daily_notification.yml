name: Daily Telegram Notification

on:
  schedule:
    - cron: '0 11 * * *' # 08:00 BRT
    - cron: '0 23 * * *' # 20:00 BRT
  workflow_dispatch:
    inputs:
      mode:
        description: 'Notification Mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening
          - test

jobs:
  notify:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run notification script
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ github.event.inputs.mode }}"
            echo "Trigger: Manual ($MODE)"
            if [[ "$MODE" == "morning" ]]; then
              node scripts/telegram_notifications.mjs --morning
            elif [[ "$MODE" == "evening" ]]; then
              node scripts/telegram_notifications.mjs --evening
            elif [[ "$MODE" == "test" ]]; then
              node scripts/telegram_notifications.mjs --test
            else
              node scripts/telegram_notifications.mjs
            fi
          elif [[ "${{ github.event.schedule }}" == "0 11 * * *" ]]; then
            echo "Trigger: Morning Cron"
            node scripts/telegram_notifications.mjs --morning
          elif [[ "${{ github.event.schedule }}" == "0 23 * * *" ]]; then
            echo "Trigger: Evening Cron"
            node scripts/telegram_notifications.mjs --evening
          else
            echo "Trigger: Other - Auto-detecting mode"
            node scripts/telegram_notifications.mjs
          fi
