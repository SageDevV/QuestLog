name: Daily WhatsApp Notification

on:
  schedule:
    - cron: '5 10 * * *' # 07:05 BRT
    - cron: '0 23 * * *' # 20:00 BRT
  workflow_dispatch: # Allow manual trigger

jobs:
  notify:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: quest-log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: quest-log/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run notification script
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
        run: |
          if [ "${{ github.event.schedule }}" == "5 10 * * *" ]; then
            echo "Running MORNING notification (07:05 BRT)"
            node scripts/whatsapp_notifications.mjs --morning
          elif [ "${{ github.event.schedule }}" == "0 23 * * *" ]; then
            echo "Running EVENING notification (20:00 BRT)"
            node scripts/whatsapp_notifications.mjs --evening
          else
            echo "Manual trigger or other event: running evening notification by default"
            node scripts/whatsapp_notifications.mjs --evening
          fi
